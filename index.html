<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garagem — Comparador de Carros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg: #1b1f24;
    --panel: #23282f;
    --panel-2: #2b3138;
    --line: #383f47;
    --text: #e8eaed;
    --muted: #9aa3ac;
    --amber: #ffb020;
    --amber-dim: #7a5b1c;
    --green: #3ddc84;
    --red: #ff5d5d;
    --blue: #4fb0ff;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}

  /* Header / dash strip */
  header{
    background:linear-gradient(180deg, #21252b 0%, #1b1f24 100%);
    border-bottom:2px solid var(--amber);
    padding:22px 24px 18px;
    position:sticky; top:0; z-index:20;
  }
  header .wrap{
    max-width:1100px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .dial{
    width:38px; height:38px; border-radius:50%;
    border:3px solid var(--amber);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background:conic-gradient(var(--amber) 0deg 260deg, var(--line) 260deg 360deg);
  }
  .brand .dial::after{
    content:''; width:22px; height:22px; border-radius:50%; background:var(--bg);
  }
  .brand h1{
    font-size:24px; margin:0; font-weight:700;
  }
  .brand p{margin:0; color:var(--muted); font-size:12.5px; letter-spacing:0.08em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .sync-badge{ font-size:11px; letter-spacing:0.04em; font-weight:600; padding:2px 8px; border-radius:20px; }
  .sync-badge.sync-on{ color:var(--green); background:#123a24; }
  .sync-badge.sync-off{ color:var(--muted); background:#2b3138; }
  .sync-badge.sync-error{ color:var(--red); background:#3a1414; }

  nav.tabs{
    display:flex; gap:6px; background:var(--panel); padding:5px; border-radius:10px; border:1px solid var(--line);
  }
  nav.tabs button{
    font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:0.04em;
    font-weight:700; font-size:14px;
    background:transparent; border:none; color:var(--muted);
    padding:9px 18px; border-radius:7px; cursor:pointer;
    transition:background .15s, color .15s;
  }
  nav.tabs button.active{ background:var(--amber); color:#1b1f24; }
  nav.tabs button:not(.active):hover{ color:var(--text); background:var(--panel-2); }

  main{max-width:1100px; margin:0 auto; padding:28px 24px 80px;}
  .view{display:none;}
  .view.active{display:block;}

  /* Cards / panels */
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px;
  }
  .panel + .panel{margin-top:20px;}
  .panel h2{
    font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:0.05em;
    font-size:19px; margin:0 0 18px; color:var(--amber); font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .panel h2 .n{
    font-size:12px; background:var(--amber); color:#1b1f24; border-radius:5px; padding:2px 7px;
    font-family:'JetBrains Mono',monospace;
  }

  /* Form */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:16px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{
    font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:600;
  }
  .field input[type=text], .field input[type=number], .field input[type=tel], .field input[type=url], .field textarea, .field select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14.5px; font-family:'Inter',sans-serif;
    outline:none; transition:border-color .15s;
  }
  .field textarea{resize:vertical; min-height:70px; font-family:'Inter',sans-serif;}
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--amber); }
  .field.span2{grid-column:span 2;}
  @media (max-width:600px){ .field.span2{grid-column:span 1;} }

  .toggle-group{display:flex; gap:8px;}
  .toggle-group button{
    flex:1; padding:10px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--muted); font-weight:600; cursor:pointer; font-size:13.5px;
    transition:all .15s;
  }
  .toggle-group button.sel-sim.active{ background:var(--green); color:#0e1a13; border-color:var(--green); }
  .toggle-group button.sel-nao.active{ background:var(--red); color:#2a0d0d; border-color:var(--red); }
  .toggle-group button.sel-avaliar.active{ background:var(--blue); color:#0d2233; border-color:var(--blue); }

  .actions-row{display:flex; gap:10px; margin-top:22px; flex-wrap:wrap;}
  .btn{
    font-family:'Rajdhani',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;
    font-size:14.5px; padding:11px 20px; border-radius:8px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:filter .15s, transform .1s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{ background:var(--amber); color:#1b1f24; }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{ background:transparent; color:var(--muted); border:1px solid var(--line); }
  .btn-ghost:hover{ color:var(--text); border-color:var(--muted); }
  .btn-danger{ background:transparent; color:var(--red); border:1px solid #5a2a2a; }
  .btn-danger:hover{ background:#3a1414; }

  /* Filters */
  .filters-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:14px;}
  .filters-grid .field select, .filters-grid .field input{padding:8px 10px; font-size:13.5px;}
  .filters-summary{color:var(--muted); font-size:13px; margin-top:14px;}

  /* Car cards list */
  .car-list{display:flex; flex-direction:column; gap:14px; margin-top:20px;}
  .car-card{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center;
  }
  @media (max-width:700px){ .car-card{grid-template-columns:1fr; text-align:left;} }

  .gauge{
    width:64px; height:64px; border-radius:50%; position:relative; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .gauge span{
    font-family:'Rajdhani',sans-serif; font-size:10.5px; font-weight:700; text-transform:uppercase;
    background:var(--panel); width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.1;
  }
  .gauge.sim{ background:conic-gradient(var(--green) 0deg 360deg); }
  .gauge.sim span{color:var(--green);}
  .gauge.nao{ background:conic-gradient(var(--red) 0deg 360deg); }
  .gauge.nao span{color:var(--red);}
  .gauge.avaliar{ background:conic-gradient(var(--blue) 0deg 360deg); }
  .gauge.avaliar span{color:var(--blue);}

  .car-main h3{ margin:0 0 4px; font-size:19px; font-weight:700; }
  .car-main .sub{ color:var(--muted); font-size:13px; margin-bottom:8px; }
  .tag-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px;}
  .tag{
    font-size:11.5px; padding:3px 9px; border-radius:5px; font-weight:600;
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
  }
  .tag.on{ color:var(--amber); border-color:var(--amber-dim); }
  .price{
    font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; color:var(--amber);
  }
  .obs-preview{ color:var(--muted); font-size:12.5px; margin-top:6px; font-style:italic; max-width:480px;}

  .car-actions{ display:flex; flex-direction:column; gap:8px; min-width:140px; }
  .icon-btn{
    display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:7px;
    font-size:13px; font-weight:600; text-decoration:none; border:1px solid var(--line);
    background:var(--panel); color:var(--text); cursor:pointer; justify-content:center;
  }
  .icon-btn.wa{ color:#25D366; border-color:#1d5c3d; }
  .icon-btn.wa:hover{ background:#12261c; }
  .icon-btn.call{ color:var(--blue); border-color:#1d3c5c; }
  .icon-btn.call:hover{ background:#0f1f2e; }
  .icon-btn.link{ color:var(--amber); border-color:var(--amber-dim); }
  .icon-btn.link:hover{ background:#2c2410; }
  .icon-btn.edit{ color:var(--muted); }
  .icon-btn.edit:hover{ color:var(--text); }

  .empty{
    text-align:center; padding:50px 20px; color:var(--muted);
  }
  .empty .dial-big{
    width:70px; height:70px; border-radius:50%; border:3px dashed var(--line);
    margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:28px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel-2); border:1px solid var(--amber); color:var(--text);
    padding:12px 20px; border-radius:9px; font-size:14px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::placeholder{color:#5c636b;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <div class="dial"></div>
      <div>
        <h1 class="display">Garagem</h1>
        <p>Comparador de carros para decisão de compra <span id="sync-badge" class="sync-badge sync-off">● conectando...</span></p>
      </div>
    </div>
    <nav class="tabs">
      <button class="active" data-view="form" onclick="switchView('form')">Cadastrar</button>
      <button data-view="list" onclick="switchView('list')">Carros cadastrados</button>
    </nav>
  </div>
</header>

<main>

  <!-- ===== FORM VIEW ===== -->
  <section id="view-form" class="view active">
    <div class="panel">
      <h2 id="form-title">Ficha do carro</h2>
      <form id="carForm" onsubmit="return false;">
        <input type="hidden" id="carId">
        <div class="grid">
          <div class="field">
            <label for="f-marca">Marca</label>
            <input type="text" id="f-marca" placeholder="Ex: Volkswagen" required>
          </div>
          <div class="field">
            <label for="f-modelo">Modelo</label>
            <input type="text" id="f-modelo" placeholder="Ex: Gol 1.6" required>
          </div>
          <div class="field">
            <label for="f-ano">Ano</label>
            <input type="number" id="f-ano" placeholder="Ex: 2019" min="1950" max="2100" required>
          </div>
          <div class="field">
            <label for="f-valor">Valor (R$)</label>
            <input type="number" id="f-valor" placeholder="Ex: 45000" min="0" step="0.01" required>
          </div>

          <div class="field">
            <label>Banco de couro</label>
            <div class="toggle-group" id="grp-couro">
              <button type="button" class="sel-sim" data-val="sim" onclick="toggleGroup('grp-couro',this)">Sim</button>
              <button type="button" class="sel-nao" data-val="nao" onclick="toggleGroup('grp-couro',this)">Não</button>
            </div>
          </div>
          <div class="field">
            <label>Automático</label>
            <div class="toggle-group" id="grp-automatico">
              <button type="button" class="sel-sim" data-val="sim" onclick="toggleGroup('grp-automatico',this)">Sim</button>
              <button type="button" class="sel-nao" data-val="nao" onclick="toggleGroup('grp-automatico',this)">Não</button>
            </div>
          </div>

          <div class="field">
            <label>Mantém interesse no carro?</label>
            <div class="toggle-group" id="grp-interesse">
              <button type="button" class="sel-sim" data-val="sim" onclick="toggleGroup('grp-interesse',this)">Sim</button>
              <button type="button" class="sel-nao" data-val="nao" onclick="toggleGroup('grp-interesse',this)">Não</button>
              <button type="button" class="sel-avaliar" data-val="avaliar" onclick="toggleGroup('grp-interesse',this)">Avaliar</button>
            </div>
          </div>

          <div class="field">
            <label for="f-telefone">Telefone de contato</label>
            <input type="tel" id="f-telefone" placeholder="Ex: 31999998888">
          </div>

          <div class="field span2">
            <label for="f-link">Link do anúncio</label>
            <input type="url" id="f-link" placeholder="https://...">
          </div>

          <div class="field span2">
            <label for="f-obs">Observações</label>
            <textarea id="f-obs" placeholder="Detalhes, estado de conservação, revisões, negociação..."></textarea>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn btn-primary" onclick="saveCar()">Salvar carro</button>
          <button class="btn btn-ghost" onclick="resetForm()">Limpar formulário</button>
        </div>
      </form>
    </div>
  </section>

  <!-- ===== LIST VIEW ===== -->
  <section id="view-list" class="view">
    <div class="panel">
      <h2>Filtros <span class="n mono" id="filter-count">0</span></h2>
      <div class="filters-grid">
        <div class="field">
          <label>Marca</label>
          <input type="text" id="ft-marca" placeholder="Buscar marca" oninput="renderList()">
        </div>
        <div class="field">
          <label>Modelo</label>
          <input type="text" id="ft-modelo" placeholder="Buscar modelo" oninput="renderList()">
        </div>
        <div class="field">
          <label>Ano mínimo</label>
          <input type="number" id="ft-ano-min" placeholder="Ex: 2015" oninput="renderList()">
        </div>
        <div class="field">
          <label>Ano máximo</label>
          <input type="number" id="ft-ano-max" placeholder="Ex: 2024" oninput="renderList()">
        </div>
        <div class="field">
          <label>Valor mínimo</label>
          <input type="number" id="ft-valor-min" placeholder="Ex: 20000" oninput="renderList()">
        </div>
        <div class="field">
          <label>Valor máximo</label>
          <input type="number" id="ft-valor-max" placeholder="Ex: 60000" oninput="renderList()">
        </div>
        <div class="field">
          <label>Banco de couro</label>
          <select id="ft-couro" onchange="renderList()">
            <option value="">Todos</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div class="field">
          <label>Automático</label>
          <select id="ft-automatico" onchange="renderList()">
            <option value="">Todos</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>
        <div class="field">
          <label>Interesse</label>
          <select id="ft-interesse" onchange="renderList()">
            <option value="">Todos</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
            <option value="avaliar">Avaliar</option>
          </select>
        </div>
        <div class="field">
          <label>Ordenar por</label>
          <select id="ft-order" onchange="renderList()">
            <option value="recentes">Mais recentes</option>
            <option value="valor-asc">Valor (menor→maior)</option>
            <option value="valor-desc">Valor (maior→menor)</option>
            <option value="ano-desc">Ano (mais novo)</option>
            <option value="ano-asc">Ano (mais antigo)</option>
          </select>
        </div>
      </div>
      <div class="filters-summary" id="filters-summary"></div>
      <div class="actions-row">
        <button class="btn btn-ghost" onclick="clearFilters()">Limpar filtros</button>
      </div>
    </div>

    <div id="car-list-container"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
  // ===== Firebase =====
  const firebaseConfig = {
    apiKey: "AIzaSyAfncNiISW8gBoq8rZvSJfobcaj9OTOeAM",
    authDomain: "enxoval-66eb3.firebaseapp.com",
    databaseURL: "https://enxoval-66eb3-default-rtdb.firebaseio.com",
    projectId: "enxoval-66eb3",
    storageBucket: "enxoval-66eb3.firebasestorage.app",
    messagingSenderId: "117302135272",
    appId: "1:117302135272:web:5d7fd63cde828820c83c5d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const carsRef = db.ref('carros_garagem');

  let cars = [];

  function setSyncBadge(state){
    const el = document.getElementById('sync-badge');
    el.classList.remove('sync-on','sync-off','sync-error');
    if(state==='on'){ el.classList.add('sync-on'); el.textContent = '● sincronizado'; }
    else if(state==='error'){ el.classList.add('sync-error'); el.textContent = '● sem conexão'; }
    else { el.classList.add('sync-off'); el.textContent = '● conectando...'; }
  }

  // Escuta em tempo real: qualquer mudança no banco atualiza a tela sozinha,
  // em qualquer dispositivo que esteja com a página aberta.
  carsRef.on('value', (snapshot) => {
    const data = snapshot.val() || {};
    cars = Object.keys(data).map(id => ({ id, ...data[id] }));
    setSyncBadge('on');
    renderList();
  }, (error) => {
    setSyncBadge('error');
    showToast('Não foi possível conectar ao banco de dados.');
  });

  db.ref('.info/connected').on('value', (snap)=>{
    if(snap.val() === false) setSyncBadge('error');
  });

  function switchView(view){
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
    document.getElementById('view-form').classList.toggle('active', view==='form');
    document.getElementById('view-list').classList.toggle('active', view==='list');
    if(view==='list') renderList();
  }

  function toggleGroup(groupId, btn){
    const group = document.getElementById(groupId);
    group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    group.dataset.value = btn.dataset.val;
  }
  function getGroupValue(groupId){
    return document.getElementById(groupId).dataset.value || '';
  }
  function setGroupValue(groupId, val){
    const group = document.getElementById(groupId);
    group.querySelectorAll('button').forEach(b=>{
      const active = b.dataset.val === val;
      b.classList.toggle('active', active);
    });
    group.dataset.value = val || '';
  }

  function resetForm(){
    document.getElementById('carId').value = '';
    document.getElementById('f-marca').value = '';
    document.getElementById('f-modelo').value = '';
    document.getElementById('f-ano').value = '';
    document.getElementById('f-valor').value = '';
    document.getElementById('f-telefone').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-obs').value = '';
    setGroupValue('grp-couro','');
    setGroupValue('grp-automatico','');
    setGroupValue('grp-interesse','');
    document.getElementById('form-title').textContent = 'Ficha do carro';
  }

  function saveCar(){
    const marca = document.getElementById('f-marca').value.trim();
    const modelo = document.getElementById('f-modelo').value.trim();
    const ano = document.getElementById('f-ano').value;
    const valor = document.getElementById('f-valor').value;

    if(!marca || !modelo || !ano || !valor){
      showToast('Preencha marca, modelo, ano e valor.');
      return;
    }

    const couro = getGroupValue('grp-couro') || 'nao';
    const automatico = getGroupValue('grp-automatico') || 'nao';
    const interesse = getGroupValue('grp-interesse') || 'avaliar';
    const telefone = document.getElementById('f-telefone').value.trim();
    const link = document.getElementById('f-link').value.trim();
    const obs = document.getElementById('f-obs').value.trim();

    const id = document.getElementById('carId').value;
    const payload = { marca, modelo, ano:Number(ano), valor:Number(valor), couro, automatico, interesse, telefone, link, obs };

    if(id){
      carsRef.child(id).update(payload)
        .then(()=> showToast('Carro atualizado.'))
        .catch(()=> showToast('Erro ao atualizar. Verifique sua conexão.'));
    }else{
      payload.createdAt = Date.now();
      const newRef = carsRef.push();
      newRef.set(payload)
        .then(()=> showToast('Carro cadastrado.'))
        .catch(()=> showToast('Erro ao salvar. Verifique sua conexão.'));
    }

    resetForm();
    switchView('list');
  }

  function editCar(id){
    const car = cars.find(c=>c.id===id);
    if(!car) return;
    document.getElementById('carId').value = car.id;
    document.getElementById('f-marca').value = car.marca;
    document.getElementById('f-modelo').value = car.modelo;
    document.getElementById('f-ano').value = car.ano;
    document.getElementById('f-valor').value = car.valor;
    document.getElementById('f-telefone').value = car.telefone || '';
    document.getElementById('f-link').value = car.link || '';
    document.getElementById('f-obs').value = car.obs || '';
    setGroupValue('grp-couro', car.couro);
    setGroupValue('grp-automatico', car.automatico);
    setGroupValue('grp-interesse', car.interesse);
    document.getElementById('form-title').textContent = 'Editando: ' + car.marca + ' ' + car.modelo;
    switchView('form');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function deleteCar(id){
    const car = cars.find(c=>c.id===id);
    if(!car) return;
    if(!confirm('Excluir o registro de "'+car.marca+' '+car.modelo+'"? Essa ação não pode ser desfeita.')) return;
    carsRef.child(id).remove()
      .then(()=> showToast('Carro excluído.'))
      .catch(()=> showToast('Erro ao excluir. Verifique sua conexão.'));
  }

  function onlyDigits(str){ return (str||'').replace(/\D/g,''); }

  function phoneLinks(telefone){
    const digits = onlyDigits(telefone);
    if(!digits) return null;
    const withCountry = digits.length <= 11 ? '55'+digits : digits;
    return {
      tel: 'tel:+' + withCountry,
      wa: 'https://wa.me/' + withCountry
    };
  }

  function formatCurrency(v){
    return Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0});
  }

  function interesseLabel(v){
    return v==='sim' ? 'Sim' : v==='nao' ? 'Não' : 'Avaliar';
  }

  function applyFilters(list){
    const marca = document.getElementById('ft-marca').value.trim().toLowerCase();
    const modelo = document.getElementById('ft-modelo').value.trim().toLowerCase();
    const anoMin = document.getElementById('ft-ano-min').value;
    const anoMax = document.getElementById('ft-ano-max').value;
    const valorMin = document.getElementById('ft-valor-min').value;
    const valorMax = document.getElementById('ft-valor-max').value;
    const couro = document.getElementById('ft-couro').value;
    const automatico = document.getElementById('ft-automatico').value;
    const interesse = document.getElementById('ft-interesse').value;
    const order = document.getElementById('ft-order').value;

    let out = list.filter(c=>{
      if(marca && !c.marca.toLowerCase().includes(marca)) return false;
      if(modelo && !c.modelo.toLowerCase().includes(modelo)) return false;
      if(anoMin && c.ano < Number(anoMin)) return false;
      if(anoMax && c.ano > Number(anoMax)) return false;
      if(valorMin && c.valor < Number(valorMin)) return false;
      if(valorMax && c.valor > Number(valorMax)) return false;
      if(couro && c.couro !== couro) return false;
      if(automatico && c.automatico !== automatico) return false;
      if(interesse && c.interesse !== interesse) return false;
      return true;
    });

    switch(order){
      case 'valor-asc': out.sort((a,b)=>a.valor-b.valor); break;
      case 'valor-desc': out.sort((a,b)=>b.valor-a.valor); break;
      case 'ano-desc': out.sort((a,b)=>b.ano-a.ano); break;
      case 'ano-asc': out.sort((a,b)=>a.ano-b.ano); break;
      default: out.sort((a,b)=>b.createdAt-a.createdAt);
    }
    return out;
  }

  function clearFilters(){
    ['ft-marca','ft-modelo','ft-ano-min','ft-ano-max','ft-valor-min','ft-valor-max'].forEach(id=>document.getElementById(id).value='');
    ['ft-couro','ft-automatico','ft-interesse'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ft-order').value='recentes';
    renderList();
  }

  function renderList(){
    const container = document.getElementById('car-list-container');
    const filtered = applyFilters(cars);

    document.getElementById('filter-count').textContent = cars.length;
    document.getElementById('filters-summary').textContent =
      filtered.length === cars.length
        ? `Mostrando todos os ${cars.length} carro(s) cadastrado(s).`
        : `Mostrando ${filtered.length} de ${cars.length} carro(s) cadastrado(s).`;

    if(cars.length === 0){
      container.innerHTML = `
        <div class="panel">
          <div class="empty">
            <div class="dial-big">🚗</div>
            <p>Nenhum carro cadastrado ainda.</p>
            <p style="font-size:13px;">Vá até a aba <strong>Cadastrar</strong> para incluir o primeiro.</p>
          </div>
        </div>`;
      return;
    }

    if(filtered.length === 0){
      container.innerHTML = `
        <div class="panel">
          <div class="empty">
            <div class="dial-big">🔍</div>
            <p>Nenhum carro corresponde aos filtros atuais.</p>
          </div>
        </div>`;
      return;
    }

    container.innerHTML = `<div class="car-list">${filtered.map(renderCarCard).join('')}</div>`;
  }

  function renderCarCard(c){
    const links = phoneLinks(c.telefone);
    const gaugeClass = c.interesse === 'sim' ? 'sim' : c.interesse === 'nao' ? 'nao' : 'avaliar';

    return `
      <div class="car-card">
        <div class="gauge ${gaugeClass}"><span>${interesseLabel(c.interesse)}</span></div>
        <div class="car-main">
          <h3>${escapeHtml(c.marca)} ${escapeHtml(c.modelo)}</h3>
          <div class="sub">Ano ${c.ano} · <span class="price">${formatCurrency(c.valor)}</span></div>
          <div class="tag-row">
            <span class="tag ${c.couro==='sim'?'on':''}">Banco de couro: ${c.couro==='sim'?'Sim':'Não'}</span>
            <span class="tag ${c.automatico==='sim'?'on':''}">Automático: ${c.automatico==='sim'?'Sim':'Não'}</span>
            ${c.telefone ? `<span class="tag">Tel: ${escapeHtml(c.telefone)}</span>` : ''}
          </div>
          ${c.obs ? `<div class="obs-preview">"${escapeHtml(c.obs)}"</div>` : ''}
        </div>
        <div class="car-actions">
          ${links ? `<a class="icon-btn call" href="${links.tel}">📞 Ligar</a>` : ''}
          ${links ? `<a class="icon-btn wa" href="${links.wa}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
          ${c.link ? `<a class="icon-btn link" href="${escapeAttr(c.link)}" target="_blank" rel="noopener">🔗 Ver anúncio</a>` : ''}
          <button class="icon-btn edit" onclick="editCar('${c.id}')">✏️ Editar</button>
          <button class="icon-btn edit" style="color:var(--red)" onclick="deleteCar('${c.id}')">🗑️ Excluir</button>
        </div>
      </div>`;
  }

  function escapeHtml(str){
    return (str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(str){
    return (str||'').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
  }

  // init: a primeira renderização acontece automaticamente
  // assim que o listener carsRef.on('value', ...) receber os dados do Firebase.
  renderList();
</script>

</body>
